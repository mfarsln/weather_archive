name: Daily Weather Archive

on:
  schedule:
    # TSİ 08:30 ve 20:30 (UTC 05:30 ve 17:30)
    - cron: '30 5,17 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu ekler

jobs:
  archive_job:
    runs-on: ubuntu-latest
    steps:
      - name: Repo dosyalarını çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Scripti Çalıştır
        run: python scraper.py

      - name: Dosyaları Repoya Geri Yükle (Commit)
        run: |
          git config --global user.name "Weather-Bot"
          git config --global user.email "actions@github.com"
          git add archive/
          git commit -m "Arşiv Güncellendi: $(date +'%Y-%m-%d')" || exit 0
          git push
