name: Daily Weather Archive

on:
  schedule:
    # 08:15 UTC = 11:15 TSİ (Hem GFS 00z hem ECMWF 00z bitti)
    # 19:15 UTC = 22:15 TSİ (Hem GFS 12z hem ECMWF 12z bitti)
    - cron: '15 8,19 * * *'
  workflow_dispatch: # Manuel çalıştırma hakkınız saklı kalsın

jobs:
  archive_job:
    runs-on: ubuntu-latest
    steps:
      - name: Repo dosyalarını çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Scripti Çalıştır
        run: python scraper.py

      - name: Dosyaları Repoya Geri Yükle (Commit)
        run: |
          git config --global user.name "Weather-Bot"
          git config --global user.email "actions@github.com"
          git add archive/
          git commit -m "Arşiv Güncellendi: $(date +'%Y-%m-%d')" || exit 0
          git push
